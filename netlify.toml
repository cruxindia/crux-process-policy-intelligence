# Netlify: build the Next.js app in web/ (Netlify's Next.js runtime is applied automatically).
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's Next.js runtime (server rendering, server actions, proxy). Declared explicitly because auto-detection
# did not apply it for the web/ base directory (first deploy published static files only → 404s).
[[plugins]]
  package = "@netlify/plugin-nextjs"
