name: db-tests
on:
  push:
    paths: ['supabase/**', 'scripts/test-db.sh', '.github/workflows/db-tests.yml']
  pull_request:
    paths: ['supabase/**', 'scripts/test-db.sh', '.github/workflows/db-tests.yml']
permissions:
  contents: read
jobs:
  clean-install-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Since 11-Nov-2026 14:37 UTC the runners cannot resolve any Ubuntu archive host (GitHub and npm resolve).
      # Fallback: the runner image's preinstalled PostgreSQL 16 + pgTAP 1.3.3 (pure SQL) built from its GitHub tag,
      # using the same substitutions as pgTAP's Makefile. Infrastructure DNS must not mask test results.
      - name: Install PostgreSQL 16 + pgTAP
        run: |
          if getent hosts azure.archive.ubuntu.com >/dev/null && sudo apt-get update -q \
             && sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap; then exit 0; fi
          echo "::warning::Ubuntu archive unreachable; using preinstalled PostgreSQL 16 and pgTAP v1.3.3 from GitHub"
          test -x /usr/lib/postgresql/16/bin/initdb
          git clone -q --depth 1 --branch v1.3.3 https://github.com/theory/pgtap.git /tmp/pgtap
          ext=/usr/share/postgresql/16/extension
          sed -e 's,MODULE_PATHNAME,$libdir/pgtap,g' -e 's,__OS__,linux,g' -e 's,__VERSION__,1.3,g' \
            /tmp/pgtap/sql/pgtap.sql.in | sudo tee "$ext/pgtap--1.3.3.sql" >/dev/null
          sudo cp /tmp/pgtap/pgtap.control "$ext/"
      - name: Clean install, seed, run pgTAP suite
        run: PGBIN=/usr/lib/postgresql/16/bin ./scripts/test-db.sh
