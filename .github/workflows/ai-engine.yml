name: ai-engine
on:
  push:
    paths: ["supabase/functions/**", "scripts/prompt-hash*.mts", "scripts/agent-charters-sql.mts", "supabase/bootstrap/*.sql", "supabase/bootstrap/*.json", "web/lib/sop*.ts", "web/lib/compare.ts", "web/lib/dimensions.ts", ".github/workflows/ai-engine.yml"]
  pull_request:
    paths: ["supabase/functions/**", "scripts/prompt-hash*.mts", "scripts/agent-charters-sql.mts", "supabase/bootstrap/*.sql", "supabase/bootstrap/*.json", "web/lib/sop*.ts", "web/lib/compare.ts", "web/lib/dimensions.ts", ".github/workflows/ai-engine.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Mocked unit tests: provider adapter, adaptive engine, discovery engine, routing/queue, draft SOP (no network, no keys).
      - run: node --experimental-strip-types --test supabase/functions/tests/*.test.ts web/lib/sop.test.ts
      # The registered prompt hashes must match the code, or the deployed functions refuse to run.
      - name: prompt provenance hashes match bootstrap SQL
        run: |
          h=$(node --experimental-strip-types scripts/prompt-hash.mts 2>/dev/null | sed -E 's/.*"template_sha256":"([0-9a-f]{64})".*/\1/')
          echo "adaptive $h"; grep -q "$h" supabase/bootstrap/adaptive_ai_setup.sql
          h2=$(node --experimental-strip-types scripts/prompt-hash-v2.mts 2>/dev/null | sed -E 's/.*"template_sha256":"([0-9a-f]{64})".*/\1/')
          echo "discovery $h2"; grep -q "$h2" supabase/bootstrap/discovery_setup.sql
          h3=$(node --experimental-strip-types scripts/prompt-hash-board.mts 2>/dev/null | sed -E 's/.*"template_sha256":"([0-9a-f]{64})".*/\1/')
          echo "board $h3"; grep -q "$h3" supabase/bootstrap/agent_board_setup.sql
          h4=$(node --experimental-strip-types scripts/prompt-hash-blueprint.mts 2>/dev/null | sed -E 's/.*"template_sha256":"([0-9a-f]{64})".*/\1/')
          echo "blueprint $h4"; grep -q "$h4" supabase/bootstrap/blueprint_setup.sql
      # The comparison used by the board and by the web app must be the same code.
      - name: compare.ts identical in Edge Functions and web
        run: diff -u supabase/functions/_shared/compare.ts web/lib/compare.ts && diff -u supabase/functions/_shared/dimensions.ts web/lib/dimensions.ts
      # The expert charters in the database are generated from agent_charters.json; the committed SQL must be current.
      - name: agent charters SQL is up to date
        run: |
          node --experimental-strip-types scripts/agent-charters-sql.mts 2>/dev/null > /tmp/agent_board_setup.sql
          diff -u supabase/bootstrap/agent_board_setup.sql /tmp/agent_board_setup.sql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/interview-ai/index.ts supabase/functions/discovery-ai/index.ts supabase/functions/board-ai/index.ts supabase/functions/blueprint-ai/index.ts
